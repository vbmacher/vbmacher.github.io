<!--
  Jekyll Simple Search loader
  See: <https://github.com/christian-fei/Simple-Jekyll-Search>
-->

{% capture result_elem %}
  <article class="px-1 px-sm-2 px-lg-4 px-xl-0">
    <header>
      <h2><a href="{url}">{title}</a></h2>
      <div class="post-meta d-flex flex-column flex-sm-row text-muted mt-1 mb-1">
        {categories}
        {tags}
      </div>
    </header>
    <p>{snippet}</p>
  </article>
{% endcapture %}

{% capture not_found %}<p class="mt-5">{{ site.data.locales[include.lang].search.no_results }}</p>{% endcapture %}

<script>
  {%- comment -%} Note: dependent library will be loaded in `js-selector.html` {%- endcomment -%}
  (() => {
    const input = document.getElementById('search-input');
    let loading = false;
    let initialized = false;

    async function loadSearch() {
      if (loading || initialized) return;
      loading = true;

      try {
        const response = await fetch('{{ '/assets/js/data/search.json' | relative_url }}');
        if (!response.ok) throw new Error(`Search index: ${response.status}`);
        const data = await response.json();
        const search = SimpleJekyllSearch({
          searchInput: input,
          resultsContainer: document.getElementById('search-results'),
          json: data,
          searchResultTemplate: '{{ result_elem | strip_newlines }}',
          noResultsText: '{{ not_found }}',
          templateMiddleware: function(prop, value, template) {
            if (prop === 'categories') {
              if (value === '') {
                return `${value}`;
              } else {
                return `<div class="me-sm-4"><i class="far fa-folder fa-fw"></i>${value}</div>`;
              }
            }

            if (prop === 'tags') {
              if (value === '') {
                return `${value}`;
              } else {
                return `<div><i class="fa fa-tag fa-fw"></i>${value}</div>`;
              }
            }
          }
        });
        initialized = true;
        /* Include anything typed while the index was downloading. */
        search.search(input.value);
      } catch (error) {
        console.warn('Search could not be loaded; retry on the next interaction.', error);
      } finally {
        loading = false;
      }
    }

    input.addEventListener('focus', loadSearch);
    input.addEventListener('input', loadSearch);
    if (document.activeElement === input || input.value) loadSearch();
  })();
</script>
